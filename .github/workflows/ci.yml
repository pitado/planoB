name: Plano B - nucleo Java
on:
  push:
  pull_request:
jobs:
  dominio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar e testar dominio
        run: bash scripts/test-domain.sh
