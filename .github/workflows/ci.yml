name: Plano B - núcleo Java e interface web
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dominio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar e validar regras do domínio
        run: bash scripts/test-domain.sh
  interface-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Testar páginas, CRUD, filtros, histórico e entradas inválidas
        run: bash scripts/test-web.sh
