services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plano_b
      POSTGRES_USER: planob
      POSTGRES_PASSWORD: planob_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - planob_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planob -d plano_b"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  planob_pgdata:
